services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag_postgres
    environment:
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ragpassword
      POSTGRES_DB: ragdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raguser -d ragdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: rag_app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8501:8501"
    environment:
      # db im selben compose-netz erreichbar
      DATABASE_URL: postgresql://raguser:ragpassword@postgres:5432/ragdb
      # ollama laeuft auf dem host
      # app-container erreicht ihn ueber host.docker.internal
      # linux braucht zusaetzlich den extra_hosts-block unten
      OLLAMA_HOST: http://host.docker.internal:11434
      # OPENAI_API_KEY nur als fallback
      # der eigentliche embedding-key kommt aus app_config (wizard)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      # hf-cache fuer reranker-modell bleibt ueber docker compose down hinweg
      - hf_cache:/root/.cache/huggingface
      # pdfs persistieren ueber container-neustarts
      - documents:/app/documents
    # linux-user: zeile aktivieren sonst kommt der container nicht an ollama
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

volumes:
  pgdata:
  hf_cache:
  documents:
