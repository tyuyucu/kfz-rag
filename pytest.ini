[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers --tb=short
markers =
    slow: markiert Tests, die länger als 1 s dauern (per Default nicht ausgeschlossen)
    requires_db: benötigt eine laufende Postgres-Instanz (per Default übersprungen)
